<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager — Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="container d-flex flex-column align-items-center justify-content-center py-5">
        <header class="text-center mb-4">
            <img class="auth-logo mb-2" src="media/contactLogo.png" alt="Contact Manager logo">
            <h1 class="h2 mb-0">Contact Manager</h1>
        </header>

        <section class="auth-card rounded-3 p-4 p-md-5">
            <h2 class="h4 text-center mb-4">Create account</h2>
            <div id="formMessage" class="alert d-none" role="status"></div>

            <form id="registerForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="firstName">First name</label>
                    <input class="form-control" type="text" id="firstName" name="firstName" autocomplete="given-name" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="lastName">Last name</label>
                    <input class="form-control" type="text" id="lastName" name="lastName" autocomplete="family-name" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Email</label>
                    <input class="form-control" type="email" id="username" name="username" autocomplete="username" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" maxlength="72" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" maxlength="72" required>
                </div>
                <button class="btn btn-login w-100" type="submit">Create account</button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account? <a href="index.html">Log in</a>
            </p>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
