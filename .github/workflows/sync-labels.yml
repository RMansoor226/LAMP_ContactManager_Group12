name: Sync Repository Labels

# Keeps GitHub labels in sync with .github/labels.yml.
# Runs whenever that file changes on main, and can be triggered manually.

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync labels from labels.yml
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: true   # don't delete labels that aren't in the file
          dry-run: false
