info:
  name: Create Contact
  type: http
  seq: 5

http:
  method: POST
  url: "{{urlBase}}/api/contacts"
  body:
    type: json
    data: |-
      {
        "FirstName": "jan",
        "LastName": "smt",
        "Email": "jane.smasdith@example.com",
        "PhoneNumber": "555-0198"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
