info:
  name: Update Contact
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{urlBase}}/api/contacts/8"
  body:
    type: json
    data: |-
      {
        "FirstName": "Jane",
        "LastName": "Smith",
        "Email": "jane.smith@example.com",
        "PhoneNumber": "555-0198"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
