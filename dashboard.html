<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="container dashboard-shell py-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Contacts</h1>
                <p id="userGreeting" class="mb-0">Sign in to manage your contacts. <a id="loginLink" href="index.html">Log in</a></p>
            </div>
            <button id="logoutButton" class="btn btn-outline-light" type="button">Log out</button>
        </header>

        <section class="contact-board rounded-3 p-4">
            <label class="form-label" for="contactSearch">Search</label>
            <input id="contactSearch" class="form-control mb-3" type="search" placeholder="Search contacts" autocomplete="off">

            <div class="d-flex gap-2 mb-3">
                <a id="createButton" class="btn btn-login" href="create.html">Create</a>
                <button id="deleteButton" class="btn btn-login" type="button">Delete</button>
                <button id="cancelDeleteButton" class="btn btn-login d-none" type="button">Cancel</button>
            </div>

            <div id="listMessage" class="alert d-none" role="status"></div>

            <div id="contactSort" class="sort-item" role="button" tabindex="0">Order: Alphabetical</div>
            <ul id="contactList" class="contact-list"></ul>
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
