<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="container dashboard-shell py-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Contacts</h1>
                <p id="userGreeting" class="mb-0">Sign in to manage your contacts. <a id="loginLink" href="index.html">Log in</a></p>
            </div>
            <button id="logoutButton" class="btn btn-outline-light" type="button">Log out</button>
        </header>

        <section class="contact-board rounded-3 p-4">
            <label class="form-label" for="contactSearch">Search</label>
            <input id="contactSearch" class="form-control mb-3" type="search" placeholder="Search contacts" autocomplete="off">

            <div class="d-flex gap-2 mb-3">
                <button id="createButton" class="btn btn-login" type="button">Create</button>
                <button id="deleteButton" class="btn btn-login" type="button">Delete</button>
            </div>

            <div id="listMessage" class="alert d-none" role="status"></div>

            <form id="createForm" class="mb-3 d-none" novalidate>
                <h2 class="h5">New contact</h2>
                <div class="row g-2">
                    <div class="col-sm-6">
                        <label class="form-label" for="newFirstName">First name</label>
                        <input class="form-control" id="newFirstName" name="firstName" maxlength="50" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="newLastName">Last name</label>
                        <input class="form-control" id="newLastName" name="lastName" maxlength="50" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="newPhone">Phone</label>
                        <input class="form-control" id="newPhone" name="phone" maxlength="50" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="newEmail">Email</label>
                        <input class="form-control" type="email" id="newEmail" name="email" maxlength="50" required>
                    </div>
                </div>
                <button class="btn btn-login mt-3" type="submit">Save contact</button>
            </form>

            <ul id="contactList" class="contact-list"></ul>
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
