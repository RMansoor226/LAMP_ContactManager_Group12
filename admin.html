<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="container dashboard-shell py-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Admin</h1>
                <p id="userGreeting" class="mb-0">Sign in to manage users. <a id="loginLink" href="index.html">Log in</a></p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light" href="dashboard.html">Contacts</a>
                <button id="logoutButton" class="btn btn-outline-light" type="button">Log out</button>
            </div>
        </header>

        <section class="contact-board rounded-3 p-4">
            <label class="form-label" for="userSearch">Search users</label>
            <input id="userSearch" class="form-control mb-3" type="search" placeholder="Search by name or username" autocomplete="off">

            <div id="listMessage" class="alert d-none" role="status"></div>

            <ul id="userList" class="contact-list"></ul>
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
